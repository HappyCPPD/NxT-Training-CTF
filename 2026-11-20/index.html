<main class="board">
  <section class="hero">
    <p class="eyebrow">NxT CTF session 2 &middot; practice board</p>
    <h1>Tissue Packet Pte. Ltd.</h1>
    <p>Every challenge is set at one terrible startup. The company is always wrong. Hints are free, and your progress is saved in this browser.</p>
    <div class="score" aria-live="polite"><b id="points">0</b><span>points</span><b id="solved">0</b><span id="solved-label">solved</span>
      <button class="ghost" id="reset">Reset progress</button></div>
  </section>
  <div id="categories"></div>
</main>
<dialog id="challenge" aria-labelledby="c-name">
  <button class="close" id="close" aria-label="Close">&times;</button>
  <p class="eyebrow" id="c-meta"></p>
  <h2 id="c-name"></h2>
  <div class="desc" id="c-desc"></div>
  <div class="files" id="c-files"></div>
  <div class="hints" id="c-hints"></div>
  <form id="flag-form" autocomplete="off">
    <label for="flag">Flag</label>
    <div class="row"><input id="flag" name="flag" placeholder="NxT{...}" spellcheck="false" required><button class="btn">Submit</button></div>
    <p id="result" role="status"></p>
  </form>
  <p class="wlink"><a id="c-writeup" href="#">Stuck? Read the writeup</a></p>
</dialog>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
